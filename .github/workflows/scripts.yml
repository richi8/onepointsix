name: Asset and sound scripts

# Runs the scripts that make public/assets on Linux, to keep them working
# anywhere, whenever they or the lists they read change. What they make isn't
# committed from here: it's checked by the unit tests and its sizes printed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - src/shared/layers.ts
      - src/client/soundlist.ts
      - .github/workflows/scripts.yml

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: node scripts/fetch-assets.mjs
      - run: node scripts/fetch-sounds.mjs
      - run: ls -lR public/assets && git status --short
      - run: npm test
